name: Build ZMS Language EXP4

on:
  push:
    paths:
      - 'tools/zms_language_exp4.c'
      - '.github/workflows/build-zms-language-exp4.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install MinGW x86
        run: sudo apt-get update && sudo apt-get install -y gcc-mingw-w64-i686
      - name: Build native x86 DLL
        run: |
          i686-w64-mingw32-gcc -Os -s -shared -o tools/zms_language_exp4.dll tools/zms_language_exp4.c -luser32 -lkernel32
          file tools/zms_language_exp4.dll
          sha256sum tools/zms_language_exp4.dll
      - name: Encode DLL payload
        run: base64 -w0 tools/zms_language_exp4.dll > tools/zms_language_exp4.dll.b64
      - name: Upload EXP4 payload artifact
        uses: actions/upload-artifact@v4
        with:
          name: zms-language-exp4
          path: |
            tools/zms_language_exp4.dll
            tools/zms_language_exp4.dll.b64
          if-no-files-found: error
